name: HopShop Inc.
description: >-
  HopShop Inc. is a consumer AI fashion-discovery and creator-monetization platform, often described
  as "Shazam for Fashion." Shoppers upload or screenshot an outfit and HopShop's visual-search AI finds
  the exact item plus similar matches across 600+ brand partners, including Bloomingdale's, Nordstrom,
  Levi's, and Tommy Hilfiger. Creators and influencers build personalized shops, link the outfits they
  feature on Instagram to shoppable products, grow their communities, and earn affiliate commissions.
  The company is backed by 500 Global. As surfaced to the API Evangelist network, HopShop operates as a
  consumer-facing mobile and web application and publishes no public developer API, SDKs, developer
  portal, or OpenAPI surface at this time; this profile captures its identity and probed domain security.
